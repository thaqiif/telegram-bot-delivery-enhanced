database_path = "data/telegram-bulk-delivery.db"
bind = "0.0.0.0:8080"
key_id = "v1"
writer_queue_capacity = 128
reader_queue_capacity = 64
max_concurrent_http = 64
max_telegram_inflight = 32
max_webhook_inflight = 4
max_blocking_threads = 8
max_recipients_per_job = 100000
global_nonterminal_recipients = 500000
request_body_bytes = 33554432
multipart_body_bytes = 67108864
shared_parameters_bytes = 65536
recipient_patch_bytes = 8192
free_disk_reserve_bytes = 1073741824
storage_high_watermark_bytes = 21474836480
wal_truncate_bytes = 67108864
retention_sweep_secs = 30
retention_batch = 500
# SSRF default-safe: leave false unless you point bots at a private/local bot server.
allow_private_targets = false
# Completion webhooks are HTTPS-to-public-hosts only by default. To deliver to a
# receiver on a trusted local network (staging), list its host(s) and, if it has
# no TLS, allow http for those hosts only:
# webhook_trusted_hosts = ["127.0.0.1"]
# webhook_allow_insecure_http = true
# Process-wide send rate across ALL bots (msg/s). Telegram limits each bot to
# ~30/s; each bot here is capped at <=25/s. Raise for several busy bots on one
# instance (e.g. 3 bots -> 75). ~5% of one vCPU per 25/s measured on 1 vCPU.
# Real ceilings beyond it: disk fsync (~3 durable writes per message) and a fixed
# 32 concurrent sends instance-wide (~100-300 msg/s at typical Telegram latency).
# global_msgs_per_sec = 25.0
