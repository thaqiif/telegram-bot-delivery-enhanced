name: release

on:
  push:
    tags: ["v*"]
  # Allow manual re-runs from the Actions tab.
  workflow_dispatch:

permissions:
  contents: write
  # Publish the container image to ghcr.io using GITHUB_TOKEN (no PAT/secret
  # needed). Note: an image pushed from a PUBLIC repo is PUBLIC by default, and
  # the baked image carries no secrets (credentials come only from env at
  # runtime), so public visibility here is intentional — see README "Container
  # image (ghcr.io)".
  packages: write

jobs:
  build-and-release:
    # One standard GitHub-hosted Ubuntu runner builds BOTH architectures: the
    # host x86_64 natively and arm64 by cross-compiling (reqwest uses rustls and
    # rusqlite is bundled, so only a target C compiler is needed). The cross-built
    # binaries link against this runner's glibc (Ubuntu 24.04, 2.39), which runs
    # on the Debian 13 deployment target (glibc 2.41) — glibc is backward
    # compatible. No self-hosted runner required.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The repo pins 1.89.0 via rust-toolchain.toml, which overrides 'stable' for
      # directory-based commands. Add the aarch64 std to that pinned toolchain
      # (the one cargo actually uses for the cross build) — NOT to 'stable'.
      - name: Add aarch64 target (repo-pinned toolchain)
        run: rustup target add aarch64-unknown-linux-gnu

      - name: Install aarch64 C cross-compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu

      - name: Build x86_64 (host)
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo build --release --locked --bin telegram-bulk-delivery

      - name: Build aarch64 (cross)
        env:
          CARGO_BUILD_JOBS: "2"
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc      # steers the cc crate (sqlite/ring C)
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
          # Make rustc link the final binary with the cross linker, not the host /usr/bin/ld.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --locked --target aarch64-unknown-linux-gnu --bin telegram-bulk-delivery

      - name: Test (capped, host)
        env:
          CARGO_BUILD_JOBS: "2"
        run: cargo test --workspace --locked -- --test-threads=1

      # --- Container image (ghcr.io) ---------------------------------------
      #
      # The image is runtime-only: it copies the binary compiled above, so it
      # reuses both the native x86_64 and the cross-built aarch64 artifact rather
      # than recompiling inside Docker (which would run the arm64 build through
      # QEMU for many minutes). Each platform gets a dedicated, tiny build
      # context; both are pushed to the same <tag>, forming a multi-arch image.
      #
      # Visibility: an image pushed from a PUBLIC repo is PUBLIC by default (repo
      # and package visibilities are effectively coupled for GHCR pushes via
      # GITHUB_TOKEN, contrary to the generic GitHub Packages docs). This is
      # intentional — the image carries no secrets, so public pull needs no auth.
      - name: Compute container version
        shell: bash
        run: |
          # Normal release path (tag push) -> vX.Y.Z. Manual workflow_dispatch
          # runs have no tag, so fall back to a short SHA and skip :latest.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}"  >> "$GITHUB_ENV"
            echo "TAG_LATEST=1"                  >> "$GITHUB_ENV"
          else
            echo "VERSION=manual-${GITHUB_SHA:0:7}" >> "$GITHUB_ENV"
            echo "TAG_LATEST=0"                     >> "$GITHUB_ENV"
          fi

      - name: Prepare per-arch build contexts
        run: |
          set -euo pipefail
          for TRI in amd64 arm64; do
            mkdir -p "ctx/${TRI}/bin"
            cp config/operator.defaults.toml "ctx/${TRI}/operator.defaults.toml"
          done
          cp target/release/telegram-bulk-delivery                  "ctx/amd64/bin/telegram-bulk-delivery"
          cp target/aarch64-unknown-linux-gnu/release/telegram-bulk-delivery "ctx/arm64/bin/telegram-bulk-delivery"
          chmod +x ctx/*/bin/telegram-bulk-delivery

      - name: Set up QEMU (emulated arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push container image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: ctx/amd64
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/telegram-bulk-delivery:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}

      - name: Build & push container image (arm64)
        uses: docker/build-push-action@v6
        with:
          context: ctx/arm64
          file: Dockerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/telegram-bulk-delivery:${{ env.VERSION }}
          build-args: VERSION=${{ env.VERSION }}

      # Add a :latest alias only on a real tagged release, so manual re-runs
      # don't race it. Copies the same multi-arch manifest list verbatim.
      - name: Add :latest alias (tagged releases only)
        if: env.TAG_LATEST == '1'
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            -t "ghcr.io/${GITHUB_REPOSITORY_OWNER}/telegram-bulk-delivery:latest" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/telegram-bulk-delivery:${VERSION}"

      - name: Package artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          X86="telegram-bulk-delivery-${VERSION}-linux-x86_64"
          ARM="telegram-bulk-delivery-${VERSION}-linux-aarch64"
          mkdir -p "${X86}" "${ARM}"
          cp target/release/telegram-bulk-delivery "${X86}/telegram-bulk-delivery"
          cp target/aarch64-unknown-linux-gnu/release/telegram-bulk-delivery "${ARM}/telegram-bulk-delivery"
          for DIR in "${X86}" "${ARM}"; do
            cp config/operator.defaults.toml "${DIR}/operator.example.toml"
            cp deploy/telegram-bulk-delivery.service "${DIR}/"
            cp deploy/install.sh "${DIR}/"
            chmod +x "${DIR}/install.sh"
            tar -czf "${DIR}.tar.gz" "${DIR}"
            sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
            file "${DIR}/telegram-bulk-delivery" | sed 's/^/  /'
            echo "  packaged ${DIR}.tar.gz ($(stat -c%s "${DIR}.tar.gz") bytes)"
          done
          echo "ARTIFACT_X86=${X86}.tar.gz"      >> "$GITHUB_ENV"
          echo "ARTIFACT_ARM=${ARM}.tar.gz"      >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARTIFACT_X86 }}
            ${{ env.ARTIFACT_X86 }}.sha256
            ${{ env.ARTIFACT_ARM }}
            ${{ env.ARTIFACT_ARM }}.sha256
