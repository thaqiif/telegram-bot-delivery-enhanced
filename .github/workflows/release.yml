name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    # Self-hosted Linux runner. Build on a Debian 13 machine so the binary's
    # glibc matches the deployment target (the artifact is glibc-linked, not
    # static). Arch is detected at build time and encoded in the artifact name,
    # so an aarch64 runner produces linux-aarch64 and x86_64 produces
    # linux-x86_64.
    runs-on: [self-hosted, linux]
    steps:
      - name: Install Rust if missing
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      - name: Build (release, locked)
        env:
          # Keep the host responsive on small runners; matches the project's
          # low-memory development constraint.
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo build --release --locked --bin telegram-bulk-delivery

      - name: Test (capped)
        env:
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo test --workspace --locked -- --test-threads=1

      - name: Package artifact
        run: |
          ARCH="$(uname -m)"
          VERSION="${GITHUB_REF_NAME#v}"
          DIR="telegram-bulk-delivery-${VERSION}-linux-${ARCH}"
          mkdir -p "${DIR}"
          cp target/release/telegram-bulk-delivery "${DIR}/"
          cp config/operator.defaults.toml "${DIR}/operator.example.toml"
          cp deploy/telegram-bulk-delivery.service "${DIR}/"
          cp deploy/install.sh "${DIR}/"
          chmod +x "${DIR}/install.sh"
          tar -czf "${DIR}.tar.gz" "${DIR}"
          sha256sum "${DIR}.tar.gz" > "${DIR}.tar.gz.sha256"
          echo "ARTIFACT=${DIR}.tar.gz" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
