[workspace]
members = ["crates/telegram-api-meta", "crates/telegram-bot-api-gen", "crates/telegram-bulk-delivery"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89"
license = "MIT"

[workspace.dependencies]
aes-gcm = "0.10.3"
axum = "0.8.4"
bytes = "1.10.1"
futures-util = "0.3.31"
http-body-util = "0.1.3"
multer = "3.1.0"
reqwest = { version = "0.12.23", default-features = false, features = ["json", "multipart", "rustls-tls"] }
uuid = { version = "1.18.1", features = ["v7"] }
base64 = "0.22.1"
blake3 = "1.8.2"
hkdf = "0.12.4"
hmac = "0.12.1"
rand = "0.8.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
tokio-util = { version = "0.7.16", features = ["io"] }
tokio = { version = "1.47.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.9.5"
tower = { version = "0.5.2", features = ["util"] }
zeroize = { version = "1.8.1", features = ["derive"] }
